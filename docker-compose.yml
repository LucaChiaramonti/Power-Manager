version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: mysql-container-power-manager
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: powers
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/main/resources/sql-scripts/:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-container
    env_file:
      - .env
    ports:
      - "8081:8080"
    depends_on:
      - mysqldb
    entrypoint: ["sh", "-c", "until nc -z mysqldb 3306; do echo waiting for mysqldb; sleep 5; done; exec java -jar /app/app.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/powers?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: dev
    restart: unless-stopped
  spring-dev:
    image: eclipse-temurin:17-jdk
    container_name: spring-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ~/.m2:/root/.m2
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/powers?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysqldb:
        condition: service_healthy
    command: mvn -DskipTests spring-boot:run

volumes:

  db_data: