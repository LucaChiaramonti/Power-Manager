version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: mysql-container-power-manager
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: power_manager
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  spring-app:
    build: .
    container_name: spring-container
    ports:
      - "8081:8080"
    depends_on:
      - mysqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/power_manager?useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: dev

    volumes:
      - ./target/classes:/app/target/classes

      - ./src/main/resources:/app/src/main/resources

volumes:

  db_data: